name: Release (Docker + PyPI)

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update kustomization image tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          sed -i "s/newTag: .*/newTag: \"$TAG\"/" deploy/k8s/kustomization.yaml

      - name: Commit updated kustomization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: update image tag to ${GITHUB_REF_NAME}"
          git push

  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update-homebrew:
    runs-on: ubuntu-latest
    needs: publish-pypi

    steps:
      - name: Wait for PyPI to be available
        run: |
          TAG=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/claude-multi-usage/$TAG/json" > /dev/null; then
              echo "PyPI package available"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for PyPI"
          exit 1

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PYPI_JSON=$(curl -sf "https://pypi.org/pypi/claude-multi-usage/$TAG/json")
          NEW_URL=$(echo "$PYPI_JSON" | python3 -c "import json,sys; [print(f['url']) for f in json.load(sys.stdin)['urls'] if f['filename'].endswith('.tar.gz')]")
          NEW_SHA=$(echo "$PYPI_JSON" | python3 -c "import json,sys; [print(f['digests']['sha256']) for f in json.load(sys.stdin)['urls'] if f['filename'].endswith('.tar.gz')]")

          # Get current formula
          FORMULA_RESP=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/hunknownn/homebrew-tap/contents/Formula/claude-multi-usage.rb")
          FILE_SHA=$(echo "$FORMULA_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          CONTENT=$(echo "$FORMULA_RESP" | python3 -c "import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode())")

          # Update only the main package url and sha256 (not dependency resources)
          UPDATED=$(python3 << PYEOF
import re
content = """$CONTENT"""
# Replace only first url and sha256 (before any resource block)
content = re.sub(
    r'(homepage.*?\n\s+)url "https://files\.pythonhosted\.org/[^"]*"(\n\s+)sha256 "[a-f0-9]+"',
    r'\1url "$NEW_URL"\2sha256 "$NEW_SHA"',
    content, count=1, flags=re.DOTALL
)
print(content)
PYEOF
          )
          UPDATED=$(echo "$UPDATED" | sed "s|\$NEW_URL|$NEW_URL|" | sed "s|\$NEW_SHA|$NEW_SHA|")
          ENCODED=$(echo "$UPDATED" | base64 -w 0)

          # Push update
          curl -sf -X PUT -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/hunknownn/homebrew-tap/contents/Formula/claude-multi-usage.rb" \
            -d "{\"message\":\"chore: bump claude-multi-usage to $TAG\",\"content\":\"$ENCODED\",\"sha\":\"$FILE_SHA\"}"
