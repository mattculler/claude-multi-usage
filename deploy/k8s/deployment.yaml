apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandburn-server
  labels:
    app: sandburn-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandburn-server
  template:
    metadata:
      labels:
        app: sandburn-server
    spec:
      containers:
        - name: sandburn-server
          image: ghcr.io/hunknownn/claude-multi-usage
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sandburn-server-data
