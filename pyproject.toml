[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "claude-multi-usage"
version = "1.2.0"
description = "Claude Code usage dashboard across multiple devices"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "nuhgnod" },
]
keywords = ["claude", "cli", "dashboard", "usage", "anthropic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
[project.urls]
Homepage = "https://github.com/mattculler/claude-multi-usage"
Repository = "https://github.com/mattculler/claude-multi-usage"
Issues = "https://github.com/mattculler/claude-multi-usage/issues"

[project.scripts]
cmu = "claude_multi_usage.cli:main"
claude-multi-usage = "claude_multi_usage.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "ruff>=0.14",
]

# Flat layout: the package directory sits next to pyproject.toml.
[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
]

[tool.ruff.lint.pyupgrade]
# Keep Optional[X] in annotations: Pydantic and FastAPI evaluate them at
# runtime, where `X | None` needs Python 3.10.
keep-runtime-typing = true
